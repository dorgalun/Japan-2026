name: Build and deploy trip journal

on:
  workflow_dispatch:        # "Run workflow" button — use this after editing the sheet
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'     # once a day, 05:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site from Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          MY_MAPS_MID: ${{ vars.MY_MAPS_MID }}
        run: python build.py

      - name: Commit refreshed build
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/itinerary.csv
          git diff --staged --quiet || git commit -m "Rebuild from sheet [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
