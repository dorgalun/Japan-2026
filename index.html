<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {

	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(images/layers-2x.png);

	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {

	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;

	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;

	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);

	}
.leaflet-control-attribution,

	}
.leaflet-attribution-flag {
	display: inline !important;

	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;

.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;

.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;

	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;

	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;

	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;

	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;
	pointer-events: auto;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;

	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {
	position: absolute;

	}
.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

	}
.leaflet-popup-scrolled {
	overflow: auto;
	}

.leaflet-oldie .leaflet-popup-content-wrapper {
	-ms-zoom: 1;
	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}

	margin-right: -12px;

	}

<style>
:root{
  --paper:#FBF3E4;
  --paper-line:#EAD9B7;
  --card:#FFFCF4;
  --ink:#2B2620;
  --muted:#8A7F68;
  --muted-2:#A79F86;
  --hero-1:#141C13;
  --hero-2:#212E1F;
  --cream:#F3ECDD;
  --gold:#D4A83C;
  --gold-deep:#B4872A;
  --gold-soft:#F1E4BE;
  --rust:#C1652B;
  --rust-deep:#A3402E;
  --rust-soft:#F3DDCB;
  --sage:#56705B;
  --sage-soft:#E2E8DC;
  --plum:#7C5980;
  --slate:#5B6B7A;
  --navy:#3B4A63;
  --blue-soft:#E7EEF5;
  --blue-text:#3E5C76;
  --teal:#2F7A6E;
  --teal-soft:#DFF0EC;
  --plum-soft:#EFE3EE;
  --navy-soft:#E3E7EE;
  --slate-soft:#EAEEF1;
  --shadow:0 1px 2px rgba(43,38,32,.05), 0 8px 20px rgba(43,38,32,.06);
  --radius:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Lora','Noto Serif JP',serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:600px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;position:relative}

/* ---------- top bar ---------- */
header.top{
  position:sticky;top:0;z-index:30;
  background:var(--cream);
  border-bottom:1px solid var(--paper-line);
  padding:12px 16px 0;
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:7px}
.brand .jp{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--ink)}
.brand .yr{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--rust);letter-spacing:.04em}
.brand-sub{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}
.weatherpill{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--ink);
  background:#fff;border:1px solid var(--paper-line);padding:5px 10px;border-radius:20px;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}

/* day chip scroller */
.daychips{
  display:flex;gap:6px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none;
}
.daychips::-webkit-scrollbar{display:none}
.daychip{
  flex-shrink:0;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;
  color:var(--muted);background:transparent;border:1px solid var(--paper-line);
  padding:6px 11px;border-radius:20px;cursor:pointer;letter-spacing:.02em;
}
.daychip.active{background:var(--hero-1);color:var(--gold-soft);border-color:var(--hero-1)}

/* ---------- bottom nav (hanko style) ---------- */
nav.tabs{
  position:sticky;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--cream);
  border-top:1px solid var(--paper-line);
  padding:6px 4px 8px;
}
nav.tabs button{
  appearance:none;border:none;background:none;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 2px;font-family:'Inter',sans-serif;font-size:9.5px;color:var(--muted);
  cursor:pointer;letter-spacing:.02em;
}
nav.tabs button .seal{
  width:26px;height:26px;border-radius:5px;border:1.5px solid var(--muted-2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif JP','Shippori Mincho',serif;font-size:14px;color:var(--muted);
  transition:all .15s;
}
nav.tabs button.active{color:var(--rust-deep);font-weight:700}
nav.tabs button.active .seal{background:var(--rust-deep);border-color:var(--rust-deep);color:var(--cream)}

/* ---------- content ---------- */
main{flex:1;padding:16px 16px 22px;min-height:60vh}
.view{display:none}
.view.active{display:block}

.section-title{
  font-family:'Playfair Display',serif;
  font-size:19px;font-weight:700;
  margin:2px 0 14px;color:var(--ink);
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
}
.section-title .kanji{color:var(--rust);font-family:'Noto Serif JP',serif;font-size:16px;margin-right:6px}
.section-title small{font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);font-weight:500}

/* ---------- hero (trip cover) ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:10px;margin-bottom:20px;
  background:radial-gradient(ellipse at 20% 15%, #263420 0%, var(--hero-1) 60%);
  color:var(--cream);padding:30px 20px 24px;text-align:center;
  box-shadow:var(--shadow);
}
.hero::before{
  content:"日本";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif JP',serif;font-size:180px;color:rgba(212,168,60,.06);font-weight:700;
  pointer-events:none;
}
.hero-eyebrow{
  display:inline-block;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.12em;
  color:var(--gold);border:1px solid rgba(212,168,60,.4);padding:5px 13px;border-radius:20px;margin-bottom:16px;
  position:relative;
}
.hero h2{
  font-family:'Playfair Display',serif;font-weight:700;font-size:34px;margin:0;line-height:1.05;
  position:relative;color:#F5EFDF;
}
.hero .script{
  display:block;font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
  color:var(--gold);font-size:30px;margin-top:2px;
}
.hero .season{
  font-family:'Inter',sans-serif;letter-spacing:.14em;font-size:11px;color:#B9C2AE;
  margin:14px 0 4px;text-transform:uppercase;position:relative;
}
.hero .route{
  font-family:'Inter',sans-serif;font-size:10.5px;color:#9AA593;letter-spacing:.03em;position:relative;
}
.hero .metastrip{
  display:flex;justify-content:center;gap:22px;margin-top:18px;flex-wrap:wrap;position:relative;
}
.hero .metastrip div{text-align:center}
.hero .metastrip .l{font-family:'Inter',sans-serif;font-size:8.5px;letter-spacing:.1em;color:#8f9a86;text-transform:uppercase}
.hero .metastrip .v{font-family:'Lora',serif;font-size:13px;color:#F0E9D8;margin-top:2px}

/* ---------- day header ---------- */
.day-head{
  margin-bottom:18px;padding-bottom:16px;
  border-bottom:1px solid var(--paper-line);position:relative;
}
.day-head .head-row{display:flex;align-items:flex-start;gap:14px}
.day-head .num-block{text-align:center;flex-shrink:0}
.day-head .num-block .lab{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.14em;color:var(--muted-2);text-transform:uppercase}
.day-head .num-block .num{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:var(--rust);line-height:1}
.day-head .info{flex:1;min-width:0}
.day-head .dateline{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day-head .city{font-family:'Playfair Display',serif;font-size:25px;font-weight:700;margin:2px 0 0;color:var(--ink)}
.day-head .city .kanji{font-family:'Noto Serif JP',serif;font-weight:500;color:var(--muted-2);font-size:17px;margin-left:8px}
.day-head .tagline{font-family:'Lora',serif;font-style:italic;font-size:13px;color:var(--muted);margin-top:5px}

.wx-detail{
  display:flex;align-items:center;gap:12px;background:var(--cream);border:1px solid var(--paper-line);
  border-radius:var(--radius);padding:10px 14px;margin-top:12px;
}
.wx-detail.wx-loading{color:var(--muted);font-family:'Lora',serif;font-style:italic;font-size:12.5px;justify-content:center}
.wx-detail .wx-icon{font-size:26px;line-height:1;flex-shrink:0}
.wx-detail .wx-body{flex:1;min-width:0}
.wx-detail .wx-temps{font-family:'Playfair Display',serif;font-size:17px;color:var(--ink)}
.wx-detail .wx-temps .lo{color:var(--muted);font-family:'Inter',sans-serif;font-size:13px}
.wx-detail .wx-temps .wx-cond{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--rust-deep);font-weight:600;margin-left:8px}
.wx-detail .wx-src{font-family:'Inter',sans-serif;font-size:10px;color:var(--muted-2);letter-spacing:.02em;margin-top:2px}

#dayMapWrap{margin-top:12px;border:1px solid var(--paper-line);border-radius:var(--radius);overflow:hidden}
#dayMap{height:260px;width:100%;background:var(--card)}
.daypin{
  width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Inter',sans-serif;
  font-size:10.5px;font-weight:700;border:2px solid #FFFCF4;box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.daypin span{transform:rotate(45deg);line-height:1}
.daymap-legend{
  display:flex;flex-wrap:wrap;gap:12px;padding:8px 12px;background:var(--card);
  border-top:1px solid var(--paper-line);font-family:'Inter',sans-serif;font-size:10px;color:var(--muted);
}
.daymap-legend span{display:inline-flex;align-items:center;gap:5px}
.daymap-legend i{display:inline-block;flex-shrink:0}
.daymap-legend .lg-line{width:14px;height:0;border-top:2px dotted #3E5C76}
.daymap-legend .lg-num{width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--sage)}
.daymap-legend .lg-dot{width:7px;height:7px;border-radius:50%;background:var(--gold-deep);border:1px solid #fff}
.daymap-link{
  display:block;text-align:center;padding:9px 12px;font-family:'Inter',sans-serif;font-size:11.5px;
  font-weight:600;color:var(--ink);background:var(--cream);border-top:1px solid var(--paper-line);
  text-decoration:none;
}
.leaflet-popup-content{font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.5;margin:9px 12px}
.leaflet-container a.leaflet-popup-close-button{padding:5px 5px 0 0}

/* ---------- timeline ---------- */
.timeline{position:relative;padding-left:58px}
.timeline::before{
  content:"";position:absolute;left:23px;top:8px;bottom:8px;width:1px;background:var(--paper-line);
}
.stop{position:relative;margin-bottom:15px}
.stop .dot{position:absolute;left:-58px;top:1px;width:46px;text-align:right;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.3}
.stop .dot .est-mark{color:var(--muted-2);font-weight:400;margin-right:1px}
.stop .dot::after{
  content:"";position:absolute;right:-19px;top:2px;width:10px;height:10px;border-radius:50%;
  background:var(--paper);border:2px solid var(--rust);
}
.stop .card{
  background:var(--card);border:1px solid var(--paper-line);border-left:4px solid var(--rust-deep);border-radius:var(--radius);
  padding:13px 14px 13px 16px;box-shadow:var(--shadow);
}
.stop.type-flight .card{border-left-color:var(--navy);background:var(--navy-soft)}
.stop.type-flight .dot::after{border-color:var(--navy)}
.stop.type-drive .card{border-left-color:var(--slate);background:var(--slate-soft)}
.stop.type-drive .dot::after{border-color:var(--slate)}
.stop.type-stay .card{border-left-color:var(--gold-deep);background:var(--gold-soft)}
.stop.type-stay .dot::after{border-color:var(--gold-deep)}
.stop.type-bar .card{border-left-color:var(--plum);background:var(--plum-soft)}
.stop.type-bar .dot::after{border-color:var(--plum)}
.stop.type-meal .card{border-left-color:var(--rust-deep);background:var(--rust-soft)}
.stop.type-meal .dot::after{border-color:var(--rust-deep)}
.stop.type-shopping .card{border-left-color:var(--teal);background:var(--teal-soft)}
.stop.type-shopping .dot::after{border-color:var(--teal)}
.stop.type-activity .card{border-left-color:var(--sage);background:var(--sage-soft)}
.stop.type-activity .dot::after{border-color:var(--sage)}
.stop .cityline{font-family:'Inter',sans-serif;font-size:10px;color:var(--rust);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;
}
.tag svg{width:14px;height:14px;flex-shrink:0}
.tag.hotel{color:var(--gold-deep)}
.tag.activity{color:var(--sage)}
.tag.food{color:var(--rust-deep)}
.tag.bar{color:var(--plum)}
.tag.drive{color:var(--slate)}
.tag.flight{color:var(--navy)}
.tag.shopping{color:var(--teal)}
.stop .title{font-family:'Lora',serif;font-size:15.5px;font-weight:500;line-height:1.42;margin:0 0 7px;color:var(--ink)}
.stop .meta{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.55}
.stop .meta b{color:var(--ink);font-weight:600}
.stop .desc{
  font-family:'Lora',serif;font-size:12.5px;line-height:1.6;color:var(--ink);opacity:.78;
  margin:0 0 8px;
}
.stop .tip{
  display:flex;gap:6px;font-family:'Lora',serif;font-style:italic;font-size:11.5px;color:var(--sage);
  background:rgba(255,255,255,.5);border-radius:4px;padding:6px 9px;margin-bottom:8px;line-height:1.5;
}
.stop .tip b{font-style:normal;font-family:'Inter',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--sage);flex-shrink:0}
.stop .actions{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;
  padding:6px 10px;border-radius:20px;border:1px solid transparent;color:var(--blue-text);text-decoration:none;
  background:var(--blue-soft);
}
.chip.gold{background:var(--gold-soft);color:var(--gold-deep)}
.badge{display:inline-block;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase;margin-left:6px}
.badge.booked{background:var(--sage-soft);color:var(--sage)}
.badge.pending{background:var(--rust-soft);color:var(--rust-deep)}

/* ---------- trip full list ---------- */
.trip-day{border:1px solid var(--paper-line);border-radius:var(--radius);margin-bottom:9px;background:var(--card);overflow:hidden}
.trip-day summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.trip-day summary::-webkit-details-marker{display:none}
.trip-day summary .l{display:flex;flex-direction:column;gap:2px}
.trip-day summary .dnum{font-family:'Playfair Display',serif;font-size:14.5px;color:var(--ink);font-weight:700}
.trip-day summary .city{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.trip-day summary .wx{font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);white-space:nowrap}
.trip-day summary .chev{color:var(--muted);transition:transform .15s;flex-shrink:0}
.trip-day[open] summary .chev{transform:rotate(90deg)}
.trip-day .events{border-top:1px solid var(--paper-line);padding:9px 14px 11px}
.trip-day .erow{display:flex;gap:10px;padding:6px 0;font-family:'Lora',serif;font-size:12.5px;border-bottom:1px dashed var(--paper-line)}
.trip-day .erow:last-child{border-bottom:none}
.trip-day .erow .t{width:42px;flex-shrink:0;color:var(--muted);font-weight:600;font-family:'Inter',sans-serif;font-size:11px;padding-top:1px}
.trip-day .erow .t .est{color:var(--muted-2);font-weight:400}
.open-day-btn{
  margin-top:9px;width:100%;background:none;border:1px dashed var(--paper-line);color:var(--rust-deep);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;padding:9px;border-radius:20px;cursor:pointer;letter-spacing:.02em;
}
.trip-day .erow .a{flex:1;line-height:1.4}
.trip-day .erow .a .c{color:var(--rust);font-weight:700;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:1px}
.trip-day .erow .a .ed{display:block;font-size:11.5px;line-height:1.5;color:var(--muted);margin-top:2px}

/* ---------- map ---------- */
#mapWrap{border:1px solid var(--paper-line);border-radius:var(--radius);overflow:hidden;background:var(--card)}
#mapFrame{width:100%;height:520px;border:0;display:block;background:#dfe6ea}
.map-note{padding:12px 14px;border-top:1px solid var(--paper-line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.map-note p{margin:0;font-family:'Lora',serif;font-style:italic;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--hero-1);background:var(--hero-1);color:var(--cream);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:9px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:#fff;color:var(--hero-1)}
.btn.small{padding:7px 11px;font-size:11px}

/* ---------- tasks ---------- */
.task-group-title{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--muted);margin:18px 0 9px;letter-spacing:.05em;text-transform:uppercase}
.task-row{display:flex;align-items:flex-start;gap:11px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:11px 13px;margin-bottom:7px}
.task-row input[type=checkbox]{width:18px;height:18px;margin-top:1px;accent-color:var(--rust-deep);flex-shrink:0}
.task-row .body{flex:1}
.task-row .body .a{font-family:'Lora',serif;font-size:13.5px;font-weight:500;margin-bottom:2px}
.task-row .body .d{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--muted)}
.task-row.done .a{text-decoration:line-through;color:var(--muted)}
.add-row{display:flex;gap:7px;margin-top:14px}
.add-row input{flex:1;border:1px solid var(--paper-line);border-radius:20px;padding:9px 13px;font-size:12.5px;font-family:'Inter',sans-serif}

/* ---------- budget ---------- */
.budget-total{background:var(--hero-1);color:var(--cream);border-radius:var(--radius);padding:18px;margin-bottom:14px;display:flex;justify-content:center;gap:30px;flex-wrap:wrap}
.budget-total .lab{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.1em;color:#B9C2AE;text-transform:uppercase}
.budget-total .num{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);margin-top:2px}
.budget-cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.budget-cat{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 12px}
.budget-cat .n{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.budget-cat .v{font-family:'Lora',serif;font-size:15px;font-weight:600;color:var(--ink);margin-top:2px}
.expense-form{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:13px;margin-bottom:14px}
.expense-form .grid{display:grid;grid-template-columns:1fr 88px;gap:7px;margin-bottom:7px}
.expense-form select,.expense-form input{border:1px solid var(--paper-line);border-radius:20px;padding:9px 12px;font-size:12.5px;font-family:'Inter',sans-serif;width:100%}
.expense-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 13px;margin-bottom:6px;font-family:'Lora',serif;font-size:12.5px}
.expense-row .cat{font-family:'Inter',sans-serif;font-size:9.5px;color:var(--rust);font-weight:700;text-transform:uppercase;letter-spacing:.03em;display:block}
.expense-row .amt{font-weight:700;color:var(--ink);font-family:'Inter',sans-serif}
.expense-row .del{color:var(--muted);font-size:16px;background:none;border:none;cursor:pointer;padding:0 4px}

.empty{text-align:center;color:var(--muted);font-family:'Lora',serif;font-style:italic;font-size:13px;padding:32px 10px;line-height:1.7}
::selection{background:var(--gold-soft)}

</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brandrow">
      <div class="brand-wrap">
        <div class="brand"><span class="jp">日本</span><span class="yr">2026</span></div>
        <div class="brand-sub">Tokyo · Hakone · Kyoto · Nara · Osaka</div>
      </div>
      <div class="weatherpill" id="headerWx">🍂 Oct 8–26</div>
    </div>
    <div class="daychips" id="dayChips"></div>
  </header>

  <main>

    <section class="view active" id="view-today">
      <div class="day-head" id="dayHead"></div>
      <div id="dayMapWrap" style="display:none"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="view" id="view-trip">
      <div class="hero" id="heroBlock"></div>
      <div class="section-title"><span class="kanji">旅程</span>Full itinerary<small>19 days</small></div>
      <div id="tripList"></div>
    </section>

    <section class="view" id="view-map">
      <div class="section-title"><span class="kanji">地図</span>Map</div>
      <div id="mapWrap">
        <iframe id="mapFrame" src="https://www.google.com/maps/d/embed?mid=1auRDMFLkK3rKKc5S2lpAZQI8GooGjY8" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        <div class="map-note">
          <p>Your live My Maps, embedded as-is — edits you make there will show up here too.</p>
          <a class="btn small ghost" href="https://www.google.com/maps/d/viewer?mid=1auRDMFLkK3rKKc5S2lpAZQI8GooGjY8&usp=sharing" target="_blank" rel="noopener">Open full map ↗</a>
        </div>
      </div>
    </section>

    <section class="view" id="view-tasks">
      <div class="section-title"><span class="kanji">予約</span>Reservations &amp; tasks</div>
      <div id="taskList"></div>
    </section>

    <section class="view" id="view-budget">
      <div class="section-title"><span class="kanji">円</span>Budget</div>
      <div class="budget-total" id="budgetTotal"></div>
      <div class="budget-cats" id="budgetCats"></div>
      <div class="expense-form">
        <div class="grid">
          <input type="text" id="expDesc" placeholder="What was it for?">
          <input type="number" id="expAmount" placeholder="Amount" min="0" step="0.01">
        </div>
        <div class="grid">
          <select id="expCat"></select>
          <select id="expCurrency"><option>JPY</option><option>ILS</option><option>USD</option></select>
        </div>
        <button class="btn" style="width:100%" onclick="addExpense()">Add expense</button>
      </div>
      <div id="expenseList"></div>
    </section>

  </main>

  <nav class="tabs">
    <button class="active" data-view="today"><span class="seal">今</span>Today</button>
    <button data-view="trip"><span class="seal">旅</span>Trip</button>
    <button data-view="map"><span class="seal">地</span>Map</button>
    <button data-view="tasks"><span class="seal">約</span>Tasks</button>
    <button data-view="budget"><span class="seal">円</span>Budget</button>
  </nav>

</div>

<script>
/* @preserve
 * Leaflet 1.9.4, a JS library for interactive maps. https://leafletjs.com

function parseTripDate(d){
  const [dd,mm,yy] = d.split('.').map(Number);
  return new Date(2000+yy, mm-1, dd);
}
function fmtDateShort(d){
  return parseTripDate(d).toLocaleDateString('en-US', {day:'numeric', month:'short'});
}

  return parseTripDate(d).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'}).toUpperCase();
}
function isoDate(d){
  const dt = parseTripDate(d);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

/* ============ TAGLINES ============ */
function dayTagline(day, idx){
  const acts = day.events.map(e=>e.activity.toLowerCase()).join(' | ');
  if(idx===0) return 'Wheels up — flight day to Japan';
  if(idx===DATA.length-1) return 'Last hours in Japan before the flight home';
  const prevCity = DATA[idx-1].city;
  if(acts.includes('arriving') && prevCity !== day.city) return `Touchdown — first steps in ${day.city}`;
  const lastCity = day.events.filter(e=>e.city).map(e=>e.city).pop();
  if(lastCity && lastCity !== day.city && idx<DATA.length-1) return `Onward from ${day.city} to ${lastCity}`;
  if(/temple|shrine|taisha|-ji\b/.test(acts)) return `Temples and quiet corners of ${day.city}`;
  if(/market|flea/.test(acts)) return `Markets, matcha, and wandering ${day.city}`;
  if(/onsen|hotel|relax/.test(acts)) return `Slowing down in ${day.city}`;
  if(/bar -|bar,|izakaya/.test(acts)) return `An evening deep dive into ${day.city}`;
  return `A day exploring ${day.city}`;
}

/* ============ WEATHER ENGINE ============ */
const WMO = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌦️',56:'🌦️',57:'🌦️',
  61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',
  71:'❄️',73:'❄️',75:'❄️',77:'❄️',80:'🌦️',81:'🌦️',82:'🌧️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};
const WMO_LABEL = {
  0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Foggy',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'
};
function wmoIcon(code){ return WMO[code] || '🌤️'; }

const WeatherEngine = (function(){
  const CACHE_KEY = 'jtrip_weather_v2';
  let cache = LS.get(CACHE_KEY, {});
  const HOUR = 3600*1000;

  function save(){ LS.set(CACHE_KEY, cache); }

  async function fetchJSON(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error('bad response');
    return res.json();
  }

  async function ensureForecast(city, lat, lon, dates){
    const c = cache[city] = cache[city] || {};
    const now = Date.now();
    if(c.forecast && (now - c.forecast.fetchedAt) < 12*HOUR) return;
    if(!dates.length) return;
    const start = dates[0], end = dates[dates.length-1];
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FTokyo&start_date=${start}&end_date=${end}`;
    try{
      const j = await fetchJSON(url);
      const byDate = {};
      j.daily.time.forEach((d,i)=>{
        byDate[d] = { max:j.daily.temperature_2m_max[i], min:j.daily.temperature_2m_min[i], code:j.daily.weathercode[i] };
      });
      c.forecast = { byDate, fetchedAt: now };
      save();
    }catch(e){ /* offline or blocked — keep whatever is cached */ }
  }

  async function ensureHistorical(city, lat, lon){
    const c = cache[city] = cache[city] || {};
    const now = Date.now();
    if(c.historical && (now - c.historical.fetchedAt) < 30*24*HOUR) return;
    const thisYear = new Date().getFullYear();
    const years = [thisYear-5,thisYear-4,thisYear-3,thisYear-2,thisYear-1];
    try{
      const results = await Promise.all(years.map(y=>{
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${y}-09-25&end_date=${y}-11-05&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FTokyo`;
        return fetchJSON(url).catch(()=>null);
      }));
      const records = [];
      results.forEach(j=>{
        if(!j || !j.daily) return;
        j.daily.time.forEach((d,i)=>{
          const [,m,day] = d.split('-').map(Number);
          records.push({ m, day, max:j.daily.temperature_2m_max[i], min:j.daily.temperature_2m_min[i], code:j.daily.weathercode ? j.daily.weathercode[i] : null });
        });
      });
      if(records.length){
        c.historical = { records, fetchedAt: now };
        save();
      }
    }catch(e){ /* ignore */ }
  }

  async function init(){
    const now = new Date(); now.setHours(0,0,0,0);
    const horizon = new Date(now); horizon.setDate(horizon.getDate()+15);
    const byCity = {};
    DATA.forEach(day=>{
      const city = day.city;
      if(!CITY_COORDS[city]) return;
      byCity[city] = byCity[city] || {forecastDates:[], needHistorical:false};
      const dt = parseTripDate(day.date);
      if(dt <= horizon && dt >= now){ byCity[city].forecastDates.push(isoDate(day.date)); }
      else if(dt > horizon){ byCity[city].needHistorical = true; }
    });
    const tasks = [];
    Object.keys(byCity).forEach(city=>{
      const [lat,lon] = CITY_COORDS[city];
      const info = byCity[city];
      if(info.forecastDates.length) tasks.push(ensureForecast(city, lat, lon, info.forecastDates));
      if(info.needHistorical) tasks.push(ensureHistorical(city, lat, lon));
    });
    await Promise.allSettled(tasks);
  }

  function getForDay(date, city){
    const c = cache[city];
    if(!c) return null;
    const iso = isoDate(date);
    if(c.forecast && c.forecast.byDate[iso]){
      const f = c.forecast.byDate[iso];
      return { max:Math.round(f.max), min:Math.round(f.min), icon: wmoIcon(f.code), code:f.code, source:'forecast' };
    }
    if(c.historical){
      const dt = parseTripDate(date);
      const m = dt.getMonth()+1, d = dt.getDate();
      const matches = c.historical.records.filter(r => r.m===m && Math.abs(r.day-d)<=2);
      if(matches.length){
        const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
        const codeCounts = {};
        matches.forEach(r=>{ if(r.code!=null) codeCounts[r.code] = (codeCounts[r.code]||0)+1; });
        let modeCode = null, best = 0;
        Object.entries(codeCounts).forEach(([code,ct])=>{ if(ct>best){ best=ct; modeCode=Number(code); } });
        return { max:Math.round(avg(matches.map(r=>r.max))), min:Math.round(avg(matches.map(r=>r.min))), icon:'🍂', code:modeCode, source:'avg' };
      }
    }
    return null;
  }

  return { init, getForDay };
})();

const KML_CAT_COLOR = {

  'Bakeries & Sweets':'#C77B9A','Shops':'#B4872A','Restaurants':'#A3402E','Markets':'#8A6A3D',

function nearbySavedPlaces(pts){
  if(typeof MY_MAPS_PLACES === 'undefined' || !pts.length) return [];
  // "nearby" = within walking-ish distance of one of today's actual stops.
  // A bounding box breaks down on intercity days (Osaka->Tokyo would swallow
  // the whole country), so measure real distance to each stop instead.
  const RADIUS_KM = 1.1, MAX_DOTS = 90;
  const toRad = x => x*Math.PI/180;
  function distKm(aLat,aLon,bLat,bLon){
    const R=6371, dLat=toRad(bLat-aLat), dLon=toRad(bLon-aLon);
    const s = Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  const routeKeys = new Set(pts.map(p=>`${p.lat.toFixed(4)},${p.lon.toFixed(4)}`));
  const out = [];
  for(const p of MY_MAPS_PLACES){
    if(routeKeys.has(`${p.lat.toFixed(4)},${p.lon.toFixed(4)}`)) continue;
    let best = Infinity;
    for(const s of pts){
      const dkm = distKm(p.lat,p.lon,s.lat,s.lon);
      if(dkm < best) best = dkm;
      if(best <= RADIUS_KM) break;
    }
    if(best <= RADIUS_KM) out.push({...p, _d:best});
  }
  out.sort((a,b)=>a._d-b._d);
  return out.slice(0, MAX_DOTS);
}

function renderDayMap(day){
  const wrap = document.getElementById('dayMapWrap');
  const pts = day.events.filter(e=>e.geo).map(e=>({...e.geo, activity:e.activity, type:typeGuess(e)}));
  if(window._dayMap){ window._dayMap.remove(); window._dayMap = null; }
  if(pts.length < 1){ wrap.style.display = 'none'; wrap.innerHTML=''; return; }
  wrap.style.display = 'block';

  const gurl = pts.length===1
    ? `https://www.google.com/maps/search/?api=1&query=${pts[0].lat},${pts[0].lon}`
    : `https://www.google.com/maps/dir/${pts.slice(0,10).map(p=>`${p.lat},${p.lon}`).join('/')}`;

  const saved = nearbySavedPlaces(pts);

  wrap.innerHTML = `
    <div id="dayMap"></div>
    <div class="daymap-legend">
      <span><i class="lg-line"></i>today's route</span>
      <span><i class="lg-num"></i>stops, in order</span>
      ${saved.length? `<span><i class="lg-dot"></i>${saved.length} saved places nearby</span>`:''}
    </div>
    <a class="daymap-link" href="${gurl}" target="_blank" rel="noopener">Open route in Google Maps ↗</a>
  `;

  const map = L.map('dayMap', {scrollWheelZoom:false, zoomControl:true, dragging:!L.Browser.mobile, attributionControl:false, tap:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom:19, subdomains:'abcd'
  }).addTo(map);

  // small pins: everything else saved in My Maps around today's area
  saved.forEach(p=>{
    const color = KML_CAT_COLOR[p.cat] || KML_CAT_COLOR.Other;
    L.circleMarker([p.lat,p.lon], {
      radius:3.5, color:'#fff', weight:1, fillColor:color, fillOpacity:.85
    }).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br><span style="color:${color};font-weight:600;font-size:11px">${esc(p.cat)}</span>${p.desc?'<br>'+esc(p.desc):''}`);
  });

  // the day's own route on top
  if(pts.length >= 2){
    L.polyline(pts.map(p=>[p.lat,p.lon]), {color:'#3E5C76', weight:2.5, opacity:.75, dashArray:'1 6', lineCap:'round'}).addTo(map);
  }
  pts.forEach((p,i)=>{
    const color = DAY_TYPE_COLOR[p.type] || '#8A7F68';
    L.marker([p.lat,p.lon], {
      icon: L.divIcon({
        className:'',
        html:`<div class="daypin" style="background:${color}"><span>${i+1}</span></div>`,
        iconSize:[24,24], iconAnchor:[12,12]
      }),
      zIndexOffset: 500
    }).addTo(map).bindPopup(`<b>${i+1}. ${esc(p.activity)}</b>`);
  });

  const bounds = pts.map(p=>[p.lat,p.lon]);
  if(pts.length===1) map.setView(bounds[0], 15);
  else map.fitBounds(bounds, {padding:[26,26]});
  window._dayMap = map;
}

function renderToday(){
  renderDayChips();
  const day = DATA[currentDay];

  const cities = [...new Set(day.events.map(e=>e.city).filter(Boolean))];
  const cityLabel = cities.length ? cities.join(' \u2192 ') : day.city;
  const kanji = CITY_KANJI[day.city] || '';
  const w = WeatherEngine.getForDay(day.date, day.city);

  document.getElementById('dayHead').innerHTML = `
    <div class="head-row">
      <div class="num-block">
        <div class="lab">Day</div>
        <div class="num">${String(currentDay+1).padStart(2,'0')}</div>
      </div>
      <div class="info">
        <div class="dateline">${fmtDateLine(day.date)}</div>

        <p class="tagline">${dayTagline(day, currentDay)}</p>
      </div>
    </div>
    ${weatherDetailHTML(w, day.city)}
  `;
  renderDayMap(day);

  const tl = document.getElementById('timeline');
  if(!day.events.length){ tl.innerHTML = `<div class="empty">Nothing scheduled for this day yet.</div>`; return; }

  tl.innerHTML = day.events.map(ev=>{
    const type = typeGuess(ev);
    const meta0 = TYPE_META[type];
    const time = ev.from ? ev.from : '\u00B7';
    const timeDisplay = ev.estTime ? `<span class="est-mark">~</span>${esc(time)}` : esc(time);
    let meta = [];
    if(ev.to && ev.to !== ev.from) meta.push(`until <b>${esc(ev.to)}</b>`);
    if(ev.info) meta.push(esc(ev.info));
    if(ev.platform && !/^\(no reservations\)/i.test(ev.platform)) meta.push(`via <b>${esc(ev.platform)}</b>`);
    let actions = [];
    if(ev.gmap) actions.push(`<a class="chip" href="${esc(ev.gmap)}" target="_blank" rel="noopener">📍 Map</a>`);
    ev.links.forEach(l=>actions.push(`<a class="chip gold" href="${esc(l)}" target="_blank" rel="noopener">🔗 Link</a>`));
    let resvBadge = '';
    if(ev.resv==='Booked') resvBadge = `<span class="badge booked">Booked</span>`;
    else if(ev.resv || ev.platform) resvBadge = `<span class="badge pending">Needs attention</span>`;
    return `
    <div class="stop type-${type}">
      <div class="dot">${timeDisplay}</div>
      <div class="card">
        ${ev.city ? `<div class="cityline">◆ ${esc(ev.city)}</div>` : ''}
        <div class="tag ${type}">${ICONS[type]} ${meta0.label}</div>
        <p class="title">${esc(ev.activity)}${resvBadge}</p>
        ${ev.desc? `<div class="desc">${esc(ev.desc)}</div>`:''}
        ${meta.length? `<div class="meta">${meta.join(' · ')}</div>`:''}
        ${ev.tip? `<div class="tip"><b>Your note</b>${esc(ev.tip)}</div>`:''}
        <div class="actions">${actions.join('')}</div>
      </div>
    </div>`;
  }).join('');
}

function buildTaskList(){

  DATA.forEach((day,di)=>{

          bookedByDefault:/^booked$/i.test(ev.resv)

    });
  });
  return tasks;
}
const ALL_TASKS = buildTaskList();

function renderTasks(){

  ALL_TASKS.forEach(t=>{

      <div class="body">
        <div class="a">${esc(t.activity)}</div>
        <div class="d">Day ${DATA.findIndex(d=>d.date===t.date)+1} · ${fmtDateShort(t.date)} · ${esc(t.city||'')}${t.platform?' · '+esc(t.platform):''}${t.note?' · '+esc(t.note):''}</div>
      </div>
    </label>`;
  let html = `<div class="task-group-title">Needs attention (${pending.length})</div>`;
  html += pending.length? pending.map(row).join('') : `<div class="empty">Everything's booked!</div>`;
  html += `<div class="task-group-title">Already booked (${booked.length})</div>`;
  html += booked.length? booked.map(row).join('') : `<div class="empty">Nothing here yet</div>`;
  html += renderCustomTasks();
  document.getElementById('taskList').innerHTML = html;
}
function toggleTask(id,val){ const done=LS.get('jtrip_tasks_done',{}); done[id]=val; LS.set('jtrip_tasks_done',done); renderTasks(); }
window.toggleTask = toggleTask;

function renderCustomTasks(){
  const custom = LS.get('jtrip_custom_tasks', []);
  let html = `<div class="task-group-title">General to-dos</div>`;
  html += custom.map((t,i)=>`
    <label class="task-row ${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleCustomTask(${i}, this.checked)">
      <div class="body"><div class="a">${esc(t.text)}</div></div>
      <button type="button" onclick="deleteCustomTask(${i})" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer">✕</button>
    </label>`).join('');
  html += `<div class="add-row"><input type="text" id="newTaskInput" placeholder="Add a to-do (e.g. buy a JR Pass)"><button class="btn small" onclick="addCustomTask()">Add</button></div>`;
  return html;
}
function addCustomTask(){
  const inp = document.getElementById('newTaskInput');
  if(!inp.value.trim()) return;
  const custom = LS.get('jtrip_custom_tasks', []);
  custom.push({text:inp.value.trim(), done:false});
  LS.set('jtrip_custom_tasks', custom);
  renderTasks();
}
function toggleCustomTask(i,val){ const c=LS.get('jtrip_custom_tasks',[]); c[i].done=val; LS.set('jtrip_custom_tasks',c); renderTasks(); }
function deleteCustomTask(i){ const c=LS.get('jtrip_custom_tasks',[]); c.splice(i,1); LS.set('jtrip_custom_tasks',c); renderTasks(); }
window.addCustomTask=addCustomTask; window.toggleCustomTask=toggleCustomTask; window.deleteCustomTask=deleteCustomTask;

/* ============ BUDGET VIEW ============ */
const CATS = ['Flights','Lodging','Food','Activities','Shopping','Transport','Other'];
function renderBudget(){
  const expenses = LS.get('jtrip_expenses', []);
  const byCurrency = {};
  const catTotals = {};
  expenses.forEach(e=>{
    byCurrency[e.currency] = (byCurrency[e.currency]||0)+e.amount;
    catTotals[e.cat] = catTotals[e.cat] || {};
    catTotals[e.cat][e.currency] = (catTotals[e.cat][e.currency]||0)+e.amount;
  });
  document.getElementById('budgetTotal').innerHTML = Object.keys(byCurrency).length
    ? Object.entries(byCurrency).map(([cur,sum])=>`<div><div class="lab">Total ${cur}</div><div class="num">${sum.toLocaleString()}</div></div>`).join('')
    : `<div><div class="lab">Total spent</div><div class="num">0</div></div>`;
  document.getElementById('budgetCats').innerHTML = CATS.map(c=>{
    const sums = catTotals[c];
    const txt = sums? Object.entries(sums).map(([cur,v])=>`${v.toLocaleString()} ${cur}`).join(' · ') : '—';
    return `<div class="budget-cat"><div class="n">${c}</div><div class="v">${txt}</div></div>`;
  }).join('');
  const list = document.getElementById('expenseList');
  if(!expenses.length){ list.innerHTML = `<div class="empty">No expenses logged yet</div>`; return; }
  list.innerHTML = expenses.slice().reverse().map((e,ridx)=>{
    const i = expenses.length-1-ridx;
    return `<div class="expense-row">
      <div><span class="cat">${esc(e.cat)}</span>${esc(e.desc||'Expense')}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="amt">${e.amount.toLocaleString()} ${e.currency}</span>
        <button class="del" onclick="deleteExpense(${i})">✕</button>
      </div>
    </div>`;
  }).join('');
}
function addExpense(){
  const desc = document.getElementById('expDesc').value.trim();
  const amount = parseFloat(document.getElementById('expAmount').value);
  const cat = document.getElementById('expCat').value;
  const currency = document.getElementById('expCurrency').value;
  if(!amount || amount<=0) return;
  const expenses = LS.get('jtrip_expenses', []);
  expenses.push({desc, amount, cat, currency});
  LS.set('jtrip_expenses', expenses);
  document.getElementById('expDesc').value=''; document.getElementById('expAmount').value='';
  renderBudget();
}
function deleteExpense(i){ const e=LS.get('jtrip_expenses',[]); e.splice(i,1); LS.set('jtrip_expenses',e); renderBudget(); }
window.addExpense=addExpense; window.deleteExpense=deleteExpense;

/* ============ INIT ============ */
document.getElementById('expCat').innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');

function safe(fn, label){
  try{ fn(); }catch(e){ console.error('Init step failed:', label, e); }
}
safe(renderToday, 'renderToday');
safe(renderTrip, 'renderTrip');
safe(renderTasks, 'renderTasks');
safe(renderBudget, 'renderBudget');

WeatherEngine.init().then(()=>{
  safe(renderToday, 'renderToday(weather)');
  safe(renderTrip, 'renderTrip(weather)');
}).catch(()=>{});

</script>
